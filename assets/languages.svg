<svg width="700" height="406" viewBox="0 0 700 406" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title {
      fill: #f0f6fc;
      font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .subtitle {
      fill: #8b949e;
      font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .language {
      fill: #c9d1d9;
      font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .percent {
      fill: #8b949e;
      font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-anchor: end;
    }
  </style>

  <rect x="0.5" y="0.5" width="699" height="405" rx="14" fill="#0d1117" stroke="#30363d" />

  <text x="20" y="34" class="title">Repository language mix</text>
  <text x="20" y="54" class="subtitle">Calculated by total code size across public repositories</text>

  <clipPath id="barClip">
    <rect x="20" y="70" width="660" height="14" rx="7" />
  </clipPath>

  <g transform="translate(20, 70)" clip-path="url(#barClip)">
<rect x="0.00" y="0" width="251.02" height="14" fill="#3572A5" />
<rect x="251.02" y="0" width="219.48" height="14" fill="#dea584" />
<rect x="470.50" y="0" width="69.02" height="14" fill="#178600" />
<rect x="539.51" y="0" width="60.72" height="14" fill="#3178c6" />
<rect x="600.23" y="0" width="46.60" height="14" fill="#f1e05a" />
<rect x="646.83" y="0" width="4.58" height="14" fill="#563d7c" />
<rect x="651.41" y="0" width="4.43" height="14" fill="#e34c26" />
<rect x="655.83" y="0" width="2.79" height="14" fill="#89e051" />
<rect x="658.62" y="0" width="2.00" height="14" fill="#8b949e" />
  </g>


  <circle cx="32" cy="107" r="6" fill="#3572A5" />
  <text x="50" y="112" class="language">Python</text>
  <text x="670" y="112" class="percent">38.0%</text>

  <circle cx="32" cy="141" r="6" fill="#dea584" />
  <text x="50" y="146" class="language">Rust</text>
  <text x="670" y="146" class="percent">33.3%</text>

  <circle cx="32" cy="175" r="6" fill="#178600" />
  <text x="50" y="180" class="language">C#</text>
  <text x="670" y="180" class="percent">10.5%</text>

  <circle cx="32" cy="209" r="6" fill="#3178c6" />
  <text x="50" y="214" class="language">TypeScript</text>
  <text x="670" y="214" class="percent">9.2%</text>

  <circle cx="32" cy="243" r="6" fill="#f1e05a" />
  <text x="50" y="248" class="language">JavaScript</text>
  <text x="670" y="248" class="percent">7.1%</text>

  <circle cx="32" cy="277" r="6" fill="#563d7c" />
  <text x="50" y="282" class="language">CSS</text>
  <text x="670" y="282" class="percent">0.7%</text>

  <circle cx="32" cy="311" r="6" fill="#e34c26" />
  <text x="50" y="316" class="language">HTML</text>
  <text x="670" y="316" class="percent">0.7%</text>

  <circle cx="32" cy="345" r="6" fill="#89e051" />
