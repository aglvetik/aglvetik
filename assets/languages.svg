  <text x="670" y="350" class="percent">0.4%</text>

  <circle cx="32" cy="379" r="6" fill="#8b949e" />
  <text x="50" y="384" class="language">Other</text>
  <text x="670" y="384" class="percent">0.2%</text>
</svg>